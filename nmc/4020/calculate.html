<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>
    <link rel="stylesheet" href="/css/calculate.css">
</head>
<body>
    
    <h1>Calculator-inator</h1>
    <div id = inputFields>
        <input type="number" id="input1" placeholder="#"><br>
        <input type="number" id="input2" placeholder="#"><br>
        <input type="text" id="output" placeholder="=">
    </div>
    

    <div id = "buttons">
            <button id = "addButton">+ <h6>Add</h6></button>
            <button id = "subtractButton">- <h6>Subtract</h6></button>
            <button id = "multiplicationButton">x <h6>Multiply</h6></button>
            <button id = "divisionButton">÷ <h6>Divide</h6></button> <br>
    </div>
    
    
        
</body>
</html>
<script src ="/basicJavaScript/calculate.js"></script>
